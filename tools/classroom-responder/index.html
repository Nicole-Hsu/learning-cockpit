<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日小挑戰</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js">
<style>
:root {
  --bg: #eafbfa; --card: #fff; --accent: #0ABAB5; --accent-dark: #078F8B;
  --text: #17302f; --text-mid: #4f7674; --text-dim: #93b0ae;
  --border: rgba(0,0,0,.10); --radius: 14px; --danger: #d96060; --ok: #4a9e78;
}
html { font-size: 19px; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { min-height: 100%; background: var(--bg); font-family: 'Microsoft JhengHei', 'Noto Sans TC', sans-serif; color: var(--text); }
button, input, select { font-family: inherit; }
#header { background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: #fff; padding: 16px 18px; }
#header h1 { font-size: 1.1rem; }
.wrap { max-width: 640px; margin: 0 auto; padding: 16px 14px 60px; }
.card { background: var(--card); border-radius: var(--radius); box-shadow: 0 2px 12px rgba(0,0,0,.08); padding: 20px; margin-bottom: 16px; }
.card h2 { font-size: 1.05rem; margin-bottom: 14px; color: var(--text-mid); }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: .88rem; font-weight: 600; color: var(--text-mid); margin-bottom: 6px; }
.field select, .field input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 1.05rem; background: #fafafa; }
.btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 700; cursor: pointer; font-size: 1rem; }
.btn:active { background: var(--accent-dark); }
.btn:disabled { background: #ccc; cursor: not-allowed; }
.err { color: var(--danger); font-size: .82rem; margin-top: 8px; }
.hidden { display: none !important; }
.hint { font-size: .78rem; color: var(--text-dim); margin-top: 6px; }
.countdown { font-size: 1.4rem; font-weight: 700; color: var(--accent-dark); text-align: center; }
.subq-card { border: 1.5px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
.subq-card .q-title { font-weight: 700; margin-bottom: 8px; }
.subq-card img { max-width: 100%; border-radius: 8px; margin-bottom: 10px; }
.opt-btn { display: block; width: 100%; text-align: left; padding: 12px 14px; margin-bottom: 8px; border-radius: 10px; border: 1.5px solid var(--border); background: #fafafa; cursor: pointer; font-size: .98rem; }
.opt-btn .lab { display:inline-block; width:26px; font-weight:700; color: var(--accent-dark); }
.opt-btn.selected { border-color: var(--accent); background: #d9f6f4; }
.opt-btn:disabled { cursor: not-allowed; opacity: .7; }
.opt-btn.correct { border-color: var(--ok); background: #e0f5e9; opacity: 1; font-weight: 700; }
.opt-btn.correct .lab { color: var(--ok); }
.opt-btn.wrong { border-color: var(--danger); background: #fbe4e4; opacity: 1; }
.opt-btn.wrong .lab { color: var(--danger); }
.status-tag { display: inline-block; font-size: .74rem; padding: 3px 10px; border-radius: 999px; background: var(--ok); color: #fff; margin-left: 8px; }
.status-tag.pending { background: var(--text-dim); }
.status-tag.wrong { background: var(--danger); }
</style>
</head>
<body>
<div id="header"><h1>今日小挑戰</h1></div>
<div class="wrap">

  <div class="card" id="errCard" style="display:none;">
    <p id="errMsg" style="color:var(--danger);"></p>
  </div>

  <div class="card hidden" id="lbCard" style="border:2px solid var(--accent);">
    <h2 style="color:var(--accent-dark);">🏆 排行榜（老師已公布）</h2>
    <div id="lbMine" style="font-weight:700;margin-bottom:10px;"></div>
    <table id="lbTable" style="width:100%;border-collapse:collapse;font-size:.9rem;">
      <thead><tr style="color:var(--text-mid);font-size:.78rem;text-align:left;"><th style="padding:4px;">名次</th><th style="padding:4px;">座號</th><th style="padding:4px;">答對</th><th style="padding:4px;">總耗時</th></tr></thead>
      <tbody id="lbBody"></tbody>
    </table>
  </div>

  <div class="card hidden" id="joinCard">
    <h2 id="joinTitle">加入作答</h2>
    <div class="field">
      <label>選擇你的座號</label>
      <select id="seatSelect"></select>
    </div>
    <div class="hint" id="seatHint"></div>
    <button class="btn" id="joinBtn" style="margin-top:14px;">加入</button>
    <div class="err" id="joinErr"></div>
  </div>

  <div class="card hidden" id="waitCard">
    <h2>等待老師發布題目…</h2>
    <p style="font-size:.85rem;color:var(--text-mid);">目前座號：<b id="mySeatDisplay"></b>（頁面會自動更新，不用重新整理）</p>
    <p style="margin-top:10px;"><a href="#" id="notMeLink" style="font-size:.82rem;color:var(--text-dim);">不是我，換座號</a></p>
  </div>

  <div class="card hidden" id="runInfoCard">
    <div style="display:flex;justify-content:space-between;align-items:center;font-size:.78rem;margin-bottom:8px;">
      <span style="color:var(--text-mid);">你的座號：<b id="mySeatDisplay2"></b></span>
      <a href="#" id="notMeLink2" style="color:var(--text-dim);">座號選錯了？換座號</a>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <h2 id="runTitle" style="margin-bottom:0;"></h2>
      <span class="countdown" id="runCountdown">--:--</span>
    </div>
  </div>

  <div id="subqArea"></div>

</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js';
import {
  initializeFirestore, doc, setDoc, getDoc, getDocs, deleteDoc, collection, query, where, orderBy, limit, onSnapshot, serverTimestamp
} from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyCQ5a6CGci369p6s8ES90-duPXZlj6oSXM",
  authDomain: "classroom-responder.firebaseapp.com",
  projectId: "classroom-responder",
  storageBucket: "classroom-responder.firebasestorage.app",
  messagingSenderId: "648909917784",
  appId: "1:648909917784:web:29281a92dd32c34656c42d"
};
const app = initializeApp(firebaseConfig);
const db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });

const params = new URLSearchParams(location.search);
const sessionId = params.get('r');
const OPT_LABELS = ['A', 'B', 'C', 'D'];

let classId = null, mySeat = null;
let currentRunBankId = null, currentRunData = null, currentBankSnapshot = null;
let countdownTimer = null, unsubRun = null, unsubJoinedList = null, unsubSession = null;

function fmtTime(sec) {
  sec = sec || 0;
  return sec >= 60 ? Math.floor(sec / 60) + ' 分 ' + (sec % 60) + ' 秒' : sec + ' 秒';
}

function renderLeaderboardCard(lb) {
  const card = document.getElementById('lbCard');
  if (!lb || !lb.rows || !lb.rows.length || !mySeat) { card.classList.add('hidden'); return; }
  const rows = lb.rows;
  const myIdx = rows.findIndex(r => String(r.seatNo) === String(mySeat));
  const mine = document.getElementById('lbMine');
  mine.textContent = myIdx >= 0
    ? '你是第 ' + (myIdx + 1) + ' 名（共 ' + rows.length + ' 人）：答對 ' + rows[myIdx].correctCount + ' 題，總耗時 ' + fmtTime(rows[myIdx].totalTime)
    : '你這次沒有作答紀錄，不在排名內';
  const body = document.getElementById('lbBody');
  body.innerHTML = '';
  const addRow = (r, rank, isMe) => {
    const tr = document.createElement('tr');
    tr.style.cssText = 'border-top:1px solid var(--border);' + (isMe ? 'background:#d9f6f4;font-weight:700;' : '');
    [rank, r.seatNo, r.correctCount + ' / ' + r.totalSubQs, fmtTime(r.totalTime)].forEach(v => {
      const td = document.createElement('td');
      td.style.padding = '6px 4px';
      td.textContent = v;
      tr.appendChild(td);
    });
    body.appendChild(tr);
  };
  rows.slice(0, 10).forEach((r, i) => addRow(r, i + 1, i === myIdx));
  if (myIdx >= 10) {
    const gap = document.createElement('tr');
    gap.innerHTML = '<td colspan="4" style="text-align:center;color:var(--text-dim);padding:2px;">…</td>';
    body.appendChild(gap);
    addRow(rows[myIdx], myIdx + 1, true);
  }
  card.classList.remove('hidden');
}

function watchSessionLeaderboard() {
  if (unsubSession) unsubSession();
  unsubSession = onSnapshot(doc(db, 'sessions', sessionId), snap => {
    renderLeaderboardCard(snap.exists() ? snap.data().leaderboard : null);
  });
}
let myResponses = {};

function showError(msg) {
  document.getElementById('errCard').style.display = 'block';
  document.getElementById('errMsg').textContent = msg;
}

async function init() {
  if (!sessionId) { showError('這個連結沒有場次代碼，請重新掃老師的 QR code。'); return; }
  const sessionSnap = await getDoc(doc(db, 'sessions', sessionId));
  if (!sessionSnap.exists()) { showError('找不到這個場次，可能代碼有誤，請跟老師確認。'); return; }
  const session = sessionSnap.data();
  if (session.status === 'ended') { showError('這堂課已經結束了。'); return; }
  classId = session.classId;

  const [classSnap, rosterSnap] = await Promise.all([
    getDoc(doc(db, 'classes', classId)),
    getDocs(collection(db, 'classes', classId, 'students'))
  ]);
  const classData = classSnap.data();
  document.getElementById('joinTitle').textContent = (classData ? classData.name : '') + '　加入作答';
  rosterList = rosterSnap.docs.map(d => d.data().seatNo || d.id).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));

  const savedSeat = localStorage.getItem('cr_seat_' + sessionId);
  if (savedSeat && rosterList.includes(savedSeat)) {
    mySeat = savedSeat;
    joinInBackground();
    showWaitOrRun();
  } else {
    await showJoinCard();
  }
}

let rosterList = [];

function joinInBackground() {
  markJoined().catch(() => {
    showError('座號登記失敗（網路不穩），老師可能看不到你已加入。請重新整理頁面再試一次。');
  });
}

async function showJoinCard() {
  const sel = document.getElementById('seatSelect');
  const roster = rosterList;

  if (unsubJoinedList) unsubJoinedList();
  unsubJoinedList = onSnapshot(collection(db, 'sessions', sessionId, 'joined'), snap => {
    const joinedSet = new Set(snap.docs.map(d => d.id));
    const prevValue = sel.value;
    sel.innerHTML = '';
    roster.forEach(seatNo => {
      const opt = document.createElement('option');
      opt.value = seatNo;
      opt.textContent = seatNo + ' 號' + (joinedSet.has(seatNo) ? '（已有人加入）' : '');
      sel.appendChild(opt);
    });
    if (roster.includes(prevValue)) sel.value = prevValue;
  });

  document.getElementById('seatHint').textContent = '如果看到「已有人加入」但不是你本人在用，請告訴老師。';
  document.getElementById('joinCard').classList.remove('hidden');
}

async function resetSeatAndRejoin() {
  localStorage.removeItem('cr_seat_' + sessionId);
  if (mySeat) {
    try { await deleteDoc(doc(db, 'sessions', sessionId, 'joined', mySeat)); } catch (e) { /* 忽略，反正本機也已經清掉了 */ }
  }
  mySeat = null;
  if (unsubSession) { unsubSession(); unsubSession = null; }
  document.getElementById('lbCard').classList.add('hidden');
  if (unsubRun) { unsubRun(); unsubRun = null; }
  document.getElementById('waitCard').classList.add('hidden');
  document.getElementById('runInfoCard').classList.add('hidden');
  document.getElementById('subqArea').innerHTML = '';
  await showJoinCard();
}

document.getElementById('notMeLink').addEventListener('click', e => { e.preventDefault(); resetSeatAndRejoin(); });
document.getElementById('notMeLink2').addEventListener('click', e => { e.preventDefault(); resetSeatAndRejoin(); });

document.getElementById('joinBtn').addEventListener('click', async () => {
  const sel = document.getElementById('seatSelect');
  mySeat = sel.value;
  if (!mySeat) { document.getElementById('joinErr').textContent = '請選擇座號'; return; }
  if (unsubJoinedList) { unsubJoinedList(); unsubJoinedList = null; }
  localStorage.setItem('cr_seat_' + sessionId, mySeat);
  joinInBackground();
  document.getElementById('joinCard').classList.add('hidden');
  showWaitOrRun();
});

async function markJoined() {
  await setDoc(doc(db, 'sessions', sessionId, 'joined', mySeat), { joinedAt: serverTimestamp() }, { merge: true });
}

async function showWaitOrRun() {
  watchSessionLeaderboard();
  document.getElementById('mySeatDisplay').textContent = mySeat + ' 號';
  document.getElementById('mySeatDisplay2').textContent = mySeat + ' 號';
  const runsRef = collection(db, 'sessions', sessionId, 'runs');
  if (unsubRun) unsubRun();
  renderedRunKey = null;
  respCache = {};
  const respReady = loadAllMyResponses();
  unsubRun = onSnapshot(query(runsRef, orderBy('startedAt', 'desc'), limit(1)), async snap => {
    if (snap.empty) {
      document.getElementById('waitCard').classList.remove('hidden');
      document.getElementById('runInfoCard').classList.add('hidden');
      document.getElementById('subqArea').innerHTML = '';
      renderedRunKey = null;
      return;
    }
    const runDoc = snap.docs[0];
    currentRunBankId = runDoc.id;
    currentRunData = runDoc.data();
    currentBankSnapshot = currentRunData;
    document.getElementById('waitCard').classList.add('hidden');
    document.getElementById('runInfoCard').classList.remove('hidden');
    document.getElementById('runTitle').textContent = currentRunData.title;
    await respReady;
    myResponses = respCache[currentRunBankId] || (respCache[currentRunBankId] = {});
    startCountdown();
    const startedMs = currentRunData.startedAt && currentRunData.startedAt.toMillis ? currentRunData.startedAt.toMillis() : 0;
    const runKey = currentRunBankId + '|' + startedMs + '|' + currentBankSnapshot.subQuestions.length;
    if (runKey === renderedRunKey) { refreshCards(); }
    else { renderedRunKey = runKey; renderSubQuestions(); }
  });
}

let renderedRunKey = null;
let respCache = {};
const pendingOrders = new Set();

async function loadAllMyResponses() {
  const respSnap = await getDocs(query(
    collection(db, 'sessions', sessionId, 'responses'), where('seatNo', '==', mySeat)
  ));
  respSnap.docs.forEach(d => {
    const r = d.data();
    (respCache[r.bankId] = respCache[r.bankId] || {})[r.order] = r;
  });
}

function isRunOpen() {
  if (currentRunData.endedAt) return false;
  const startedAtMs = currentRunData.startedAt && currentRunData.startedAt.toMillis ? currentRunData.startedAt.toMillis() : Date.now();
  return Date.now() < startedAtMs + currentBankSnapshot.timeLimitSeconds * 1000;
}

function startCountdown() {
  if (countdownTimer) clearInterval(countdownTimer);
  const startedAtMs = currentRunData.startedAt && currentRunData.startedAt.toMillis ? currentRunData.startedAt.toMillis() : Date.now();
  const deadline = startedAtMs + currentBankSnapshot.timeLimitSeconds * 1000;
  function tick() {
    const remain = Math.max(0, Math.floor((deadline - Date.now()) / 1000));
    const mm = String(Math.floor(remain / 60)).padStart(2, '0');
    const ss = String(remain % 60).padStart(2, '0');
    document.getElementById('runCountdown').textContent = mm + ':' + ss;
    if (remain <= 0) {
      clearInterval(countdownTimer);
      document.getElementById('runCountdown').textContent = '已結束';
      refreshCards();
    }
  }
  tick();
  countdownTimer = setInterval(tick, 1000);
}

let cardEls = {};

function applyCardState(card, sq, open) {
  const mine = myResponses[sq.order];
  const tag = card.querySelector('.status-tag');
  let text, cls = 'status-tag';
  if (pendingOrders.has(sq.order)) { text = '送出中…'; cls += ' pending'; }
  else if (!open) {
    if (mine) { text = mine.isCorrect ? '答對了' : '答錯了，你選 ' + mine.selectedAnswer; if (!mine.isCorrect) cls += ' wrong'; }
    else { text = '逾時未作答'; cls += ' pending'; }
  } else if (mine) { text = '已作答 ' + mine.selectedAnswer; }
  else { text = '尚未作答'; cls += ' pending'; }
  tag.className = cls;
  tag.textContent = text;
  card.querySelectorAll('.opt-btn').forEach((btn, i) => {
    const l = OPT_LABELS[i];
    let c = 'opt-btn';
    if (mine && mine.selectedAnswer === l) c += ' selected';
    if (!open) {
      if (l === sq.correctAnswer) c += ' correct';
      else if (mine && mine.selectedAnswer === l) c += ' wrong';
    }
    btn.className = c;
    btn.disabled = !open;
  });
}

function refreshCards() {
  const open = isRunOpen();
  currentBankSnapshot.subQuestions.forEach(sq => {
    if (cardEls[sq.order]) applyCardState(cardEls[sq.order], sq, open);
  });
}

function renderSubQuestions() {
  const area = document.getElementById('subqArea');
  area.innerHTML = '';
  cardEls = {};
  const open = isRunOpen();
  currentBankSnapshot.subQuestions.forEach(sq => {
    const card = document.createElement('div');
    card.className = 'subq-card';
    let html = '<div class="q-title">小題 ' + sq.order + '：' + sq.content + '<span class="status-tag"></span></div>';
    const images = (sq.imageUrls && sq.imageUrls.length) ? sq.imageUrls : (sq.imageUrl ? [sq.imageUrl] : []);
    images.forEach(url => {
      html += '<img src="' + String(url).replace(/"/g, '&quot;') + '" referrerpolicy="no-referrer" ' +
        'onerror="this.outerHTML=\'<div style=&quot;color:#d96060;font-size:.8rem;&quot;>（圖片載入失敗，請告訴老師）</div>\'">';
    });
    card.innerHTML = html;
    OPT_LABELS.forEach((l, i) => {
      const btn = document.createElement('button');
      btn.innerHTML = '<span class="lab">' + l + '</span>' + (sq.options[i] || '');
      btn.addEventListener('click', () => submitAnswer(sq, l));
      card.appendChild(btn);
    });
    card.querySelectorAll('button').forEach(b => { b.className = 'opt-btn'; });
    cardEls[sq.order] = card;
    applyCardState(card, sq, open);
    area.appendChild(card);
  });
}

function submitAnswer(sq, selected) {
  if (!isRunOpen()) { refreshCards(); return; }
  const startedAtMs = currentRunData.startedAt && currentRunData.startedAt.toMillis ? currentRunData.startedAt.toMillis() : Date.now();
  const timeUsedSeconds = Math.max(0, Math.round((Date.now() - startedAtMs) / 1000));
  const isCorrect = selected === sq.correctAnswer;
  const respId = mySeat + '_' + currentRunBankId + '_' + sq.order;
  const bankId = currentRunBankId;
  const runResponses = myResponses;
  const previous = runResponses[sq.order];

  runResponses[sq.order] = { seatNo: mySeat, bankId, order: sq.order, selectedAnswer: selected, isCorrect, timeUsedSeconds };
  pendingOrders.add(sq.order);
  refreshCards();

  setDoc(doc(db, 'sessions', sessionId, 'responses', respId), {
    seatNo: mySeat, bankId, order: sq.order,
    selectedAnswer: selected, isCorrect, timeUsedSeconds, answeredAt: serverTimestamp()
  }).then(() => {
    pendingOrders.delete(sq.order);
    if (bankId === currentRunBankId) refreshCards();
  }).catch(() => {
    pendingOrders.delete(sq.order);
    if (previous) runResponses[sq.order] = previous; else delete runResponses[sq.order];
    if (bankId === currentRunBankId) refreshCards();
    showError('這一題沒有送出成功（網路不穩），請再點一次答案。');
  });
}

init();
</script>
</body>
</html>
