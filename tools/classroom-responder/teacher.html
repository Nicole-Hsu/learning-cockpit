<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日小挑戰 — 老師後台</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root {
  --bg: #eafbfa; --card: #fff; --accent: #0ABAB5; --accent-dark: #078F8B;
  --text: #17302f; --text-mid: #4f7674; --text-dim: #93b0ae;
  --border: rgba(0,0,0,.10); --radius: 14px; --danger: #d96060; --ok: #4a9e78;
}
html { font-size: 19px; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { min-height: 100%; background: var(--bg); font-family: 'Microsoft JhengHei', 'Noto Sans TC', sans-serif; color: var(--text); }
button, input, select, textarea { font-family: inherit; }
#header { background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: #fff; padding: 18px 20px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
#header h1 { font-size: 1.25rem; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 20px 16px 60px; }
.card { background: var(--card); border-radius: var(--radius); box-shadow: 0 2px 12px rgba(0,0,0,.08); padding: 22px; margin-bottom: 18px; }
.card h2 { font-size: 1.15rem; margin-bottom: 16px; color: var(--text-mid); }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: .9rem; font-weight: 600; color: var(--text-mid); margin-bottom: 7px; }
.field input, .field textarea, .field select { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 1.05rem; background: #fafafa; }
.field input:not([type=number]):not([type=checkbox]), .field select { max-width: 520px; }
.field textarea { min-height: 80px; resize: vertical; }
.btn { display: inline-block; padding: 13px 22px; border: none; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 700; cursor: pointer; font-size: 1rem; }
.btn:active { background: var(--accent-dark); }
.btn.secondary { background: #eee; color: var(--text); }
.btn:disabled { background: #ccc; cursor: not-allowed; }
.btn.small { padding: 7px 14px; font-size: .85rem; }
.err { color: var(--danger); font-size: .82rem; margin-top: 8px; }
.hidden { display: none !important; }
.row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.row > * { flex: 1; min-width: 140px; }
#roomLink { font-size: .9rem; color: var(--accent-dark); word-break: break-all; }
#qrBox { background: #fff; padding: 8px; border-radius: 10px; display: inline-block; }
.list-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .88rem; gap: 10px; }
.badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: .74rem; background: var(--ok); color: #fff; }
.badge.warn { background: var(--danger); }
.subq-block { border: 1.5px dashed var(--border); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
.subq-block h4 { font-size: .9rem; color: var(--text-mid); margin-bottom: 10px; display:flex; justify-content:space-between; align-items:center; }
.opt-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.opt-row span { width: 22px; font-weight: 700; color: var(--accent-dark); }
.opt-row input[type=radio] { width: auto; }
.bar-wrap { margin-bottom: 14px; }
.bar-wrap .bar-q { font-weight: 600; margin-bottom: 6px; font-size: .92rem; }
.bar-line { margin-bottom: 10px; }
.bar-line .bar-label { display: block; font-weight: 700; color: var(--accent-dark); font-size: .88rem; margin-bottom: 4px; }
.bar-line .bar-row { display: flex; align-items: center; gap: 8px; }
.bar-line .bar-track { flex: 1; background: #eee; border-radius: 6px; overflow: hidden; height: 20px; position: relative; }
.bar-line .bar-fill { background: var(--accent); height: 100%; transition: width .3s; }
.bar-line .bar-count { width: 34px; text-align: right; font-size: .82rem; color: var(--text-mid); }
.bar-line.correct .bar-label { color: var(--ok); }
.bar-line.correct .bar-fill { background: var(--ok); }
table.lb { width: 100%; border-collapse: collapse; font-size: .9rem; }
table.lb th, table.lb td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
table.lb th { color: var(--text-mid); font-size: .78rem; }
.countdown { font-size: 1.6rem; font-weight: 700; color: var(--accent-dark); }
</style>
</head>
<body>
<div id="header">
  <h1>今日小挑戰 — 老師後台</h1>
  <button id="backToClassBtn" class="hidden" style="border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.15);color:#fff;padding:8px 14px;border-radius:10px;font-size:.85rem;cursor:pointer;white-space:nowrap;">← 換班級</button>
</div>
<div class="wrap">

  <div class="card" id="loginCard">
    <h2>登入</h2>
    <button class="btn" id="loginBtn">使用 Google 登入</button>
    <div class="err" id="loginErr"></div>
  </div>

  <div class="card hidden" id="adminCard">
    <h2>授權老師管理（只有你看得到這張卡片）</h2>
    <div id="teacherList" style="font-size:.9rem;margin-bottom:14px;"></div>
    <div class="row">
      <input id="newTeacherEmail" placeholder="老師的 Google 信箱">
      <input id="newTeacherSubjects" placeholder="科別，逗號分隔，例如 地科,生物">
      <button class="btn secondary" id="addTeacherBtn" style="flex:0 0 auto;">新增授權</button>
    </div>
    <div class="err" id="adminErr"></div>
  </div>

  <div class="card hidden" id="classCard">
    <h2>科別、學年度與班級</h2>
    <div class="field">
      <label>選擇科別</label>
      <select id="subjectSelect"><option value="">— 新增科別 —</option></select>
    </div>
    <div class="field" id="newSubjectField">
      <label>新科別名稱</label>
      <input id="newSubjectInput" placeholder="例如：護理">
      <datalist id="subjectOptions"></datalist>
    </div>

    <div class="field hidden" id="yearSelectField">
      <label>選擇學年度</label>
      <select id="yearSelect"><option value="">— 新增學年度 —</option></select>
    </div>
    <div class="field hidden" id="newYearField">
      <label>新學年度</label>
      <input id="newYearInput" placeholder="例如：114-1" style="max-width:160px;">
    </div>

    <div class="field hidden" id="classSelectField">
      <label>選擇這個科別／學年度底下的既有班級</label>
      <select id="classSelect"><option value="">— 新增班級 —</option></select>
    </div>
    <div id="newClassFields" class="hidden">
      <div class="field">
        <label>新班級名稱</label>
        <input id="newClassName" placeholder="例如 三年一班">
      </div>
    </div>
    <div class="row" style="align-items:center;">
      <button class="btn" id="useClassBtn">使用這個班級</button>
      <button class="btn secondary hidden" id="deleteClassBtn" style="color:var(--danger);flex:0 0 auto;">刪除這個班級</button>
    </div>
    <div class="err" id="classErr"></div>
    <div id="editClassArea" class="hidden" style="margin-top:16px;border-top:1px solid var(--border);padding-top:16px;">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
        <div style="font-size:.82rem;font-weight:600;color:var(--text-mid);">改這個班級的名稱／學年度／科別</div>
        <button class="btn secondary small" id="toggleEditClassBtn">展開編輯</button>
      </div>
      <div id="editClassFields" class="hidden" style="margin-top:12px;">
        <div class="field"><label>班級名稱</label><input id="editClassName"></div>
        <div class="field"><label>學年度</label><input id="editClassYear" placeholder="例如：114-1" style="max-width:160px;"></div>
        <div class="field"><label>科別</label><input id="editClassSubject" list="subjectOptions"></div>
        <button class="btn secondary" id="saveClassEditBtn">儲存修改</button>
        <div class="err" id="editClassErr"></div>
      </div>
    </div>
  </div>

  <div class="card hidden" id="rosterCard">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
      <h2 style="margin-bottom:0;">班級名單</h2>
      <div>
        <span id="rosterCount" style="font-size:.85rem;color:var(--text-mid);"></span>
        <button class="btn secondary small" id="toggleRosterBtn" style="margin-left:10px;">展開名單</button>
      </div>
    </div>
    <div id="rosterEditArea" class="hidden" style="margin-top:14px;">
      <div class="field">
        <label>座號（匿名，不用姓名/學號）——可以打範圍例如 1-45，或一行一個、逗號分隔都可以</label>
        <textarea id="rosterInput" placeholder="1-45"></textarea>
      </div>
      <button class="btn" id="saveRosterBtn">儲存名單</button>
      <div class="err" id="rosterErr"></div>
    </div>
  </div>

  <div class="card hidden" id="bankListCard">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
      <h2 style="margin-bottom:0;">題庫（同科別老師共用）</h2>
      <button class="btn secondary small" id="newBankToggleBtn">＋ 新增大題</button>
    </div>
    <div id="bankList" style="font-size:.9rem;margin-top:10px;"></div>
  </div>

  <div class="card hidden" id="newBankCard">
    <h2 id="bankFormTitle">新增大題</h2>
    <div class="field">
      <label>大題標題</label>
      <input id="bankTitle" placeholder="例如：地層構造判讀">
    </div>
    <div class="field">
      <label>限時（秒）</label>
      <input id="bankTimeLimit" type="number" min="10" value="300" style="max-width:160px;">
    </div>
    <div id="subqList"></div>
    <button class="btn secondary small" id="addSubqBtn" style="margin-bottom:14px;">＋ 新增小題</button>
    <div>
      <button class="btn" id="saveBankBtn">儲存這個大題</button>
      <button class="btn secondary" id="cancelBankBtn">取消</button>
    </div>
    <div class="err" id="bankErr"></div>
  </div>

  <div class="card hidden" id="sessionCard">
    <h2>今天的課</h2>
    <div class="field">
      <label>搜尋題庫（標題或小題內容關鍵字）</label>
      <input id="publishBankSearch" placeholder="例如：血壓、感染…">
    </div>
    <div class="field">
      <label>選一個大題發布</label>
      <select id="publishBankSelect"></select>
    </div>
    <div id="publishPreview" style="margin-bottom:16px;"></div>
    <button class="btn" id="publishBtn">發布這個大題</button>
    <div class="err" id="publishErr"></div>
    <div id="sessionInfoArea" class="hidden" style="margin-top:18px;padding-top:18px;border-top:1px solid var(--border);">
      <div class="row" style="align-items:center;">
        <div>
          <div id="roomLink" style="font-size:.9rem;color:var(--accent-dark);"></div>
          <button class="btn secondary small" id="copyLinkBtn" style="margin-top:8px;">複製連結</button>
          <div id="qrBox" style="margin-top:10px;"></div>
        </div>
      </div>
      <div style="margin:16px 0;font-size:.85rem;color:var(--text-mid);">
        已加入 <b id="joinedCount">0</b> / <span id="rosterTotal">0</span> 人
        <button class="btn secondary small" id="toggleJoinedListBtn" style="margin-left:8px;">展開名單</button>
      </div>
      <div id="joinedList" class="hidden" style="margin-bottom:14px;"></div>
      <div id="sessionActiveArea" style="margin-top:16px;">
        <button class="btn secondary" id="endSessionBtn" style="color:var(--danger);">結束今天的課</button>
        <button class="btn secondary" id="showLeaderboardBtn">看排行榜</button>
      </div>
      <div id="sessionEndedArea" class="hidden" style="margin-top:16px;">
        <span class="badge" style="background:var(--text-dim);">已結束</span>
        <button class="btn secondary" id="showLeaderboardBtnEnded">看排行榜</button>
        <button class="btn secondary" id="startNewSessionBtn">開始新的一堂課</button>
      </div>
    </div>
  </div>

  <div class="card hidden" id="runCard">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <h2 style="margin-bottom:0;" id="runTitle">進行中的大題</h2>
      <span class="countdown" id="runCountdown">--:--</span>
    </div>
    <div id="voteBoard" style="margin-top:14px;"></div>
    <div style="margin-top:16px;">
      <button class="btn secondary" id="endRunBtn" style="color:var(--danger);">結束這一大題</button>
      <button class="btn secondary" id="newRunBtn">發布下一大題</button>
    </div>
  </div>

  <div class="card hidden" id="leaderboardCard">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <h2 style="margin-bottom:0;">排行榜</h2>
      <button class="btn secondary small" id="recalcLeaderboardBtn">重新計算</button>
    </div>
    <table class="lb" id="lbTable" style="margin-top:12px;">
      <thead><tr><th>名次</th><th>座號</th><th>答對</th><th>作答數</th><th>總耗時</th></tr></thead>
      <tbody id="lbBody"></tbody>
    </table>
  </div>

</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js';
import {
  getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut
} from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js';
import {
  getFirestore, doc, setDoc, updateDoc, getDoc, getDocs, collection, query, where, orderBy, limit,
  writeBatch, onSnapshot, deleteDoc, serverTimestamp, Timestamp
} from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyCQ5a6CGci369p6s8ES90-duPXZlj6oSXM",
  authDomain: "classroom-responder.firebaseapp.com",
  projectId: "classroom-responder",
  storageBucket: "classroom-responder.firebasestorage.app",
  messagingSenderId: "648909917784",
  appId: "1:648909917784:web:29281a92dd32c34656c42d"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const ROOT_ADMIN_EMAIL = 'nicolehsu2004@gmail.com';
const OPT_LABELS = ['A', 'B', 'C', 'D'];

let myEmail = null, myUid = null, mySubjects = [], isRoot = false;
let classId = null, classData = null;
let sessionId = null, sessionData = null;
let currentRunBankId = null, currentRunData = null, currentBankSnapshot = null;
let countdownTimer = null, unsubRun = null, unsubJoined = null, unsubResponses = null;
let responsesCache = [];

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

document.getElementById('loginBtn').addEventListener('click', async () => {
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) { document.getElementById('loginErr').textContent = e.message; }
});

onAuthStateChanged(auth, async user => {
  if (!user) return;
  myEmail = (user.email || '').toLowerCase();
  myUid = user.uid;
  isRoot = myEmail === ROOT_ADMIN_EMAIL;
  const tSnap = await getDoc(doc(db, 'teachers', myEmail));
  if (!tSnap.exists() && !isRoot) {
    document.getElementById('loginErr').textContent = '這個帳號（' + user.email + '）還沒被授權使用，請聯絡管理者新增這個信箱。';
    await signOut(auth);
    return;
  }
  mySubjects = tSnap.exists() ? (tSnap.data().subjects || []) : [];
  document.getElementById('loginCard').classList.add('hidden');
  document.getElementById('classCard').classList.remove('hidden');
  document.getElementById('backToClassBtn').classList.remove('hidden');
  if (isRoot) {
    document.getElementById('adminCard').classList.remove('hidden');
    loadTeacherList();
  }
  const subjList = document.getElementById('subjectOptions');
  subjList.innerHTML = '';
  mySubjects.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s;
    subjList.appendChild(opt);
  });
  const subjSel = document.getElementById('subjectSelect');
  subjSel.innerHTML = '<option value="">— 新增科別 —</option>';
  mySubjects.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    subjSel.appendChild(opt);
  });
  updateClassCardVisibility();
});

async function loadYearsForSubject(subject) {
  const sel = document.getElementById('yearSelect');
  sel.innerHTML = '<option value="">— 新增學年度 —</option>';
  const snap = await getDocs(query(collection(db, 'classes'), where('teacherId', '==', myUid), where('subject', '==', subject)));
  const years = [...new Set(snap.docs.map(d => d.data().academicYear).filter(Boolean))];
  years.sort((a, b) => b.localeCompare(a, undefined, { numeric: true }));
  years.forEach(y => {
    const opt = document.createElement('option');
    opt.value = y; opt.textContent = y;
    sel.appendChild(opt);
  });
}

async function loadClassesForSubjectYear(subject, year) {
  const sel = document.getElementById('classSelect');
  sel.innerHTML = '<option value="">— 新增班級 —</option>';
  const snap = await getDocs(query(
    collection(db, 'classes'), where('teacherId', '==', myUid), where('subject', '==', subject), where('academicYear', '==', year)
  ));
  snap.forEach(d => {
    const opt = document.createElement('option');
    opt.value = d.id; opt.textContent = d.data().name;
    sel.appendChild(opt);
  });
}

function updateClassCardVisibility() {
  const isNewSubject = !document.getElementById('subjectSelect').value;
  const isNewYear = !document.getElementById('yearSelect').value;
  const isNewClass = !document.getElementById('classSelect').value;
  document.getElementById('newSubjectField').classList.toggle('hidden', !isNewSubject);
  document.getElementById('yearSelectField').classList.toggle('hidden', isNewSubject);
  document.getElementById('newYearField').classList.toggle('hidden', isNewSubject || !isNewYear);
  document.getElementById('classSelectField').classList.toggle('hidden', isNewSubject || isNewYear);
  document.getElementById('newClassFields').classList.toggle('hidden', !(isNewSubject || isNewYear || isNewClass));
  document.getElementById('deleteClassBtn').classList.toggle('hidden', !(!isNewSubject && !isNewYear && !isNewClass));
}

document.getElementById('subjectSelect').addEventListener('change', async e => {
  const subject = e.target.value;
  document.getElementById('newSubjectInput').value = '';
  document.getElementById('newYearInput').value = '';
  document.getElementById('newClassName').value = '';
  document.getElementById('yearSelect').innerHTML = '<option value="">— 新增學年度 —</option>';
  document.getElementById('classSelect').innerHTML = '<option value="">— 新增班級 —</option>';
  document.getElementById('editClassArea').classList.add('hidden');
  if (subject) {
    await loadYearsForSubject(subject);
  }
  updateClassCardVisibility();
});

document.getElementById('yearSelect').addEventListener('change', async e => {
  const subject = document.getElementById('subjectSelect').value;
  const year = e.target.value;
  document.getElementById('newYearInput').value = '';
  document.getElementById('newClassName').value = '';
  document.getElementById('classSelect').innerHTML = '<option value="">— 新增班級 —</option>';
  document.getElementById('editClassArea').classList.add('hidden');
  if (year) {
    await loadClassesForSubjectYear(subject, year);
  }
  updateClassCardVisibility();
});

async function loadTeacherList() {
  const listEl = document.getElementById('teacherList');
  listEl.innerHTML = '讀取中…';
  const snap = await getDocs(collection(db, 'teachers'));
  listEl.innerHTML = '';
  if (snap.empty) {
    listEl.innerHTML = '<p style="color:var(--text-mid);">目前只有你（管理者）能登入，上面新增其他老師的信箱＋科別。</p>';
    return;
  }
  snap.forEach(d => {
    const row = document.createElement('div');
    row.className = 'list-row';
    const span = document.createElement('span');
    span.textContent = d.id + '　（' + (d.data().subjects || []).join('、') + '）';
    const removeBtn = document.createElement('button');
    removeBtn.textContent = '移除';
    removeBtn.style.cssText = 'border:1px solid var(--border);background:#fff;color:var(--danger);font-size:.78rem;padding:3px 10px;border-radius:999px;cursor:pointer;';
    removeBtn.addEventListener('click', async () => {
      if (!confirm('確定要移除 ' + d.id + ' 的授權嗎？')) return;
      await deleteDoc(doc(db, 'teachers', d.id));
      loadTeacherList();
    });
    row.appendChild(span); row.appendChild(removeBtn);
    listEl.appendChild(row);
  });
}

document.getElementById('addTeacherBtn').addEventListener('click', async () => {
  const emailInput = document.getElementById('newTeacherEmail');
  const subjInput = document.getElementById('newTeacherSubjects');
  const errEl = document.getElementById('adminErr');
  errEl.textContent = '';
  const email = emailInput.value.trim().toLowerCase();
  const subjects = subjInput.value.split(/[,，]+/).map(s => s.trim()).filter(Boolean);
  if (!email || !email.includes('@')) { errEl.textContent = '請輸入完整的信箱'; return; }
  if (!subjects.length) { errEl.textContent = '請至少輸入一個科別'; return; }
  try {
    await setDoc(doc(db, 'teachers', email), { subjects, addedAt: serverTimestamp() });
    emailInput.value = ''; subjInput.value = '';
    loadTeacherList();
  } catch (e) { errEl.textContent = e.message; }
});

document.getElementById('backToClassBtn').addEventListener('click', () => {
  classId = null; classData = null; sessionId = null; sessionData = null;
  if (unsubRun) unsubRun();
  if (unsubJoined) unsubJoined();
  if (unsubResponses) unsubResponses();
  if (countdownTimer) clearInterval(countdownTimer);
  document.getElementById('rosterCard').classList.add('hidden');
  document.getElementById('bankListCard').classList.add('hidden');
  document.getElementById('newBankCard').classList.add('hidden');
  document.getElementById('sessionCard').classList.add('hidden');
  document.getElementById('sessionInfoArea').classList.add('hidden');
  document.getElementById('runCard').classList.add('hidden');
  document.getElementById('leaderboardCard').classList.add('hidden');
  document.getElementById('editClassArea').classList.add('hidden');
  document.getElementById('subjectSelect').value = '';
  document.getElementById('yearSelect').innerHTML = '<option value="">— 新增學年度 —</option>';
  document.getElementById('classSelect').innerHTML = '<option value="">— 新增班級 —</option>';
  updateClassCardVisibility();
  document.getElementById('classCard').scrollIntoView({ behavior: 'smooth' });
});

function parseSeatNos(text) {
  const tokens = text.split(/[,，\n]+/).map(t => t.trim()).filter(Boolean);
  const seats = new Set();
  tokens.forEach(tok => {
    const rangeMatch = tok.match(/^(\d+)\s*-\s*(\d+)$/);
    if (rangeMatch) {
      let start = parseInt(rangeMatch[1], 10), end = parseInt(rangeMatch[2], 10);
      if (start > end) { const t = start; start = end; end = t; }
      for (let i = start; i <= end; i++) seats.add(String(i));
    } else { seats.add(tok); }
  });
  return [...seats];
}

function subqBlockHtml(idx) {
  return `
  <div class="subq-block" data-idx="${idx}">
    <h4>小題 ${idx + 1} <button type="button" class="btn secondary small removeSubqBtn">刪除這小題</button></h4>
    <div class="field"><label>題目內容</label><textarea class="subq-content" placeholder="小題文字"></textarea></div>
    <div class="field"><label>圖片網址（選填）</label><input class="subq-image" placeholder="https://...（可放這個 repo 的 images/ 或外部圖床）"></div>
    ${OPT_LABELS.map(l => `<div class="opt-row"><span>${l}</span><input class="subq-opt" data-label="${l}" placeholder="選項 ${l}"><input type="radio" name="correct-${idx}" class="subq-correct" value="${l}" title="正解"></div>`).join('')}
  </div>`;
}

function addSubqBlock(sq) {
  const list = document.getElementById('subqList');
  const idx = list.children.length;
  const div = document.createElement('div');
  div.innerHTML = subqBlockHtml(idx);
  const block = div.firstElementChild;
  block.querySelector('.removeSubqBtn').addEventListener('click', () => block.remove());
  if (sq) {
    block.querySelector('.subq-content').value = sq.content || '';
    block.querySelector('.subq-image').value = sq.imageUrl || '';
    const optInputs = block.querySelectorAll('.subq-opt');
    (sq.options || []).forEach((val, i) => { if (optInputs[i]) optInputs[i].value = val; });
    if (sq.correctAnswer) {
      const radio = block.querySelector('.subq-correct[value="' + sq.correctAnswer + '"]');
      if (radio) radio.checked = true;
    }
  }
  list.appendChild(block);
}

let publishBankCache = {};

function bankMatchesKeyword(bank, keyword) {
  if (!keyword) return true;
  const kw = keyword.toLowerCase();
  if (bank.title.toLowerCase().includes(kw)) return true;
  return bank.subQuestions.some(sq =>
    sq.content.toLowerCase().includes(kw) || sq.options.some(o => o.toLowerCase().includes(kw))
  );
}

function applyBankSearchFilter() {
  const keyword = document.getElementById('publishBankSearch').value.trim();
  const sel = document.getElementById('publishBankSelect');
  const prevValue = sel.value;
  sel.innerHTML = '';
  const ids = Object.keys(publishBankCache).filter(id => bankMatchesKeyword(publishBankCache[id], keyword));
  if (!ids.length) {
    sel.innerHTML = '<option value="">（沒有符合關鍵字的題庫）</option>';
    renderPublishPreview();
    return;
  }
  ids.sort((a, b) => publishBankCache[a].title.localeCompare(publishBankCache[b].title, undefined, { numeric: true }));
  ids.forEach(id => {
    const opt = document.createElement('option');
    opt.value = id; opt.textContent = publishBankCache[id].title;
    sel.appendChild(opt);
  });
  if (ids.includes(prevValue)) sel.value = prevValue;
  renderPublishPreview();
}

function randomCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

async function checkTodaySession() {
  const snap = await getDocs(query(
    collection(db, 'sessions'), where('classId', '==', classId), where('date', '==', todayStr())
  ));
  if (snap.empty) {
    sessionId = null; sessionData = null;
    document.getElementById('sessionInfoArea').classList.add('hidden');
    return;
  }
  // 優先接續還在進行的場次；沒有進行中的，就接上今天最近結束的那一個，讓「結束今天的課」之後還能回來看排行榜
  const activeDoc = snap.docs.find(d => d.data().status === 'active');
  const chosen = activeDoc || snap.docs.sort((a, b) =>
    (b.data().createdAt && b.data().createdAt.toMillis ? b.data().createdAt.toMillis() : 0) -
    (a.data().createdAt && a.data().createdAt.toMillis ? a.data().createdAt.toMillis() : 0)
  )[0];
  sessionId = chosen.id;
  sessionData = chosen.data();
  showSessionInfo();
  if (sessionData.status === 'active') {
    showSessionActiveUI();
    await watchActiveRun();
  } else {
    showSessionEndedUI();
  }
}

function showSessionActiveUI() {
  document.getElementById('sessionActiveArea').classList.remove('hidden');
  document.getElementById('sessionEndedArea').classList.add('hidden');
}

function showSessionEndedUI() {
  document.getElementById('sessionActiveArea').classList.add('hidden');

  if (unsubRun) unsubRun();

  if (countdownTimer) clearInterval(countdownTimer);
}

function showSessionInfo() {
  document.getElementById('sessionInfoArea').classList.remove('hidden');
  const url = location.origin + location.pathname.replace('teacher.html', 'index.html') + '?r=' + sessionId;
  document.getElementById('roomLink').textContent = '場次代碼：' + sessionId + '　連結：' + url;
  document.getElementById('copyLinkBtn').onclick = async () => {
    try { await navigator.clipboard.writeText(url); } catch (e) { alert('複製失敗，請手動選取：' + url); }
  };
  document.getElementById('qrBox').innerHTML = '';
  new QRCode(document.getElementById('qrBox'), { text: url, width: 140, height: 140 });

  if (unsubJoined) unsubJoined();
  getDocs(collection(db, 'classes', classId, 'students')).then(rosterSnap => {
    const roster = rosterSnap.docs.map(d => d.data().seatNo || d.id).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
    document.getElementById('rosterTotal').textContent = roster.length;
    unsubJoined = onSnapshot(collection(db, 'sessions', sessionId, 'joined'), snap => {
      const joinedMap = {};
      snap.forEach(d => { joinedMap[d.id] = d.data(); });
      document.getElementById('joinedCount').textContent = snap.size;
      renderJoinedList(roster, joinedMap);
    });
  });
}

document.getElementById('publishBtn').addEventListener('click', async () => {
  const errEl = document.getElementById('publishErr');
  errEl.textContent = '';
  const bankId = document.getElementById('publishBankSelect').value;
  if (!bankId) { errEl.textContent = '請先建立題庫'; return; }
  try {
    const rosterCheck = await getDocs(collection(db, 'classes', classId, 'students'));
    if (rosterCheck.empty) { errEl.textContent = '這個班級還沒有名單，請先儲存名單'; return; }
    const bankSnap = await getDoc(doc(db, 'questionBanks', bankId));
    const bank = bankSnap.data();

    const pickedOrders = new Set([...document.querySelectorAll('.subq-pick:checked')].map(cb => parseInt(cb.dataset.order, 10)));
    const chosenSubQuestions = bank.subQuestions
      .filter(sq => pickedOrders.has(sq.order))
      .map((sq, i) => ({ ...sq, order: i + 1 }));
    if (!chosenSubQuestions.length) { errEl.textContent = '請至少勾選一個小題'; return; }

    if (!sessionId || sessionData.status !== 'active') {
      const code = randomCode();
      sessionData = { classId, teacherId: myUid, date: todayStr(), status: 'active', createdAt: serverTimestamp() };
      await setDoc(doc(db, 'sessions', code), sessionData);
      sessionId = code;
      showSessionInfo();
      showSessionActiveUI();
    }
    await setDoc(doc(db, 'sessions', sessionId, 'runs', bankId), {
      title: bank.title, timeLimitSeconds: bank.timeLimitSeconds, subQuestions: chosenSubQuestions,
      startedAt: serverTimestamp(), endedAt: null
    });
    await watchActiveRun();
  } catch (e) { errEl.textContent = e.message; }
});

async function watchActiveRun() {
  const runsSnap = await getDocs(query(collection(db, 'sessions', sessionId, 'runs'), orderBy('startedAt', 'desc'), limit(1)));
  if (runsSnap.empty) return;
  const runDoc = runsSnap.docs[0];
  currentRunBankId = runDoc.id;
  currentBankSnapshot = runDoc.data();
  openRunBoard();
}

function openRunBoard() {
  document.getElementById('runCard').classList.remove('hidden');
  document.getElementById('runTitle').textContent = currentBankSnapshot.title;

  if (unsubRun) unsubRun();
  unsubRun = onSnapshot(doc(db, 'sessions', sessionId, 'runs', currentRunBankId), snap => {
    currentRunData = snap.data();
    if (!currentRunData) return;
    startCountdown();
  });

  if (unsubResponses) unsubResponses();
  unsubResponses = onSnapshot(
    query(collection(db, 'sessions', sessionId, 'responses'), where('bankId', '==', currentRunBankId)),
    snap => { responsesCache = snap.docs.map(d => d.data()); renderVoteBoard(); }
  );
}

function renderJoinedList(roster, joinedMap) {
  const list = document.getElementById('joinedList');
  list.innerHTML = '';
  roster.forEach(seatNo => {
    const joined = joinedMap[seatNo];
    const row = document.createElement('div');
    row.className = 'list-row';
    const label = document.createElement('span');
    label.textContent = seatNo + ' 號' + (joined ? '' : '（尚未加入）');
    if (!joined) label.style.color = 'var(--text-dim)';
    row.appendChild(label);
    if (joined) {
      const releaseBtn = document.createElement('button');
      releaseBtn.className = 'btn secondary small';
      releaseBtn.style.color = 'var(--danger)';
      releaseBtn.textContent = '解除';
      releaseBtn.title = '如果這個座號被別人誤選，用這個解除，讓正確的人可以重新選';
      releaseBtn.addEventListener('click', async () => {
        if (!confirm(seatNo + ' 號的加入紀錄要解除嗎？解除後這個座號可以被重新選一次。')) return;
        await deleteDoc(doc(db, 'sessions', sessionId, 'joined', seatNo));
      });
      row.appendChild(releaseBtn);
    }
    list.appendChild(row);
  });
}

document.getElementById('toggleJoinedListBtn').addEventListener('click', () => {
  const list = document.getElementById('joinedList');
  const nowHidden = list.classList.toggle('hidden');
  document.getElementById('toggleJoinedListBtn').textContent = nowHidden ? '展開名單' : '收合名單';
});

function startCountdown() {
  if (countdownTimer) clearInterval(countdownTimer);
  const startedAtMs = currentRunData.startedAt && currentRunData.startedAt.toMillis ? currentRunData.startedAt.toMillis() : Date.now();
  const deadline = startedAtMs + currentBankSnapshot.timeLimitSeconds * 1000;
  function tick() {
    const remain = Math.max(0, Math.floor((deadline - Date.now()) / 1000));
    const mm = String(Math.floor(remain / 60)).padStart(2, '0');
    const ss = String(remain % 60).padStart(2, '0');
    document.getElementById('runCountdown').textContent = mm + ':' + ss;
    if (remain <= 0 || currentRunData.endedAt) {
      clearInterval(countdownTimer);
      document.getElementById('runCountdown').textContent = '已結束';
    }
  }
  tick();
  countdownTimer = setInterval(tick, 1000);
}

function renderVoteBoard() {
  const board = document.getElementById('voteBoard');
  board.innerHTML = '';
  currentBankSnapshot.subQuestions.forEach(sq => {
    const wrap = document.createElement('div');
    wrap.className = 'bar-wrap';
    const answers = responsesCache.filter(r => r.order === sq.order);
    const total = answers.length || 1;
    const counts = { A: 0, B: 0, C: 0, D: 0 };
    answers.forEach(a => { if (counts[a.selectedAnswer] !== undefined) counts[a.selectedAnswer]++; });
    let html = '<div class="bar-q">小題 ' + sq.order + '：' + sq.content + '</div>';
    OPT_LABELS.forEach((l, i) => {
      const pct = Math.round((counts[l] / total) * 100);
      const isCorrect = l === sq.correctAnswer;
      html += '<div class="bar-line' + (isCorrect ? ' correct' : '') + '"><span class="bar-label">' + l + '：' + (sq.options[i] || '') + '</span>' +
        '<div class="bar-row"><div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
        '<span class="bar-count">' + counts[l] + '</span></div></div>';
    });
    wrap.innerHTML = html;
    board.appendChild(wrap);
  });
}

document.getElementById('endRunBtn').addEventListener('click', async () => {
  if (!confirm('確定要結束這一大題嗎？')) return;
  await updateDoc(doc(db, 'sessions', sessionId, 'runs', currentRunBankId), { endedAt: serverTimestamp() });
});

document.getElementById('newRunBtn').addEventListener('click', () => {
  document.getElementById('sessionCard').scrollIntoView({ behavior: 'smooth' });
});

document.getElementById('endSessionBtn').addEventListener('click', async () => {
  if (!confirm('確定要結束今天的課嗎？結束後這個場次代碼就不能再發布新大題了，但還是可以回來看排行榜。')) return;
  await updateDoc(doc(db, 'sessions', sessionId), { status: 'ended', endedAt: serverTimestamp() });
  sessionData.status = 'ended';
  showSessionEndedUI();
});

document.getElementById('startNewSessionBtn').addEventListener('click', () => {
  sessionId = null; sessionData = null;
  document.getElementById('sessionInfoArea').classList.add('hidden');
});

// ---------- 排行榜 ----------

async function computeLeaderboard() {
  const rosterSnap = await getDocs(collection(db, 'classes', classId, 'students'));
  const roster = rosterSnap.docs.map(d => d.data().seatNo || d.id);
  const runsSnap = await getDocs(collection(db, 'sessions', sessionId, 'runs'));
  const runs = runsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  const totalSubQs = runs.reduce((sum, r) => sum + (r.subQuestions ? r.subQuestions.length : 0), 0);
  const respSnap = await getDocs(collection(db, 'sessions', sessionId, 'responses'));
  const responses = respSnap.docs.map(d => d.data());

  const rows = roster.map(seatNo => {
    const mine = responses.filter(r => r.seatNo === seatNo);
    const correctCount = mine.filter(r => r.isCorrect).length;
    const totalTime = mine.reduce((s, r) => s + (r.timeUsedSeconds || 0), 0);
    return { seatNo, correctCount, answeredCount: mine.length, totalSubQs, totalTime };
  });
  rows.sort((a, b) => b.correctCount - a.correctCount || a.totalTime - b.totalTime);
  return rows;
}

async function renderLeaderboard() {
  const body = document.getElementById('lbBody');
  body.innerHTML = '<tr><td colspan="5">計算中…</td></tr>';
  try {
    const rows = await computeLeaderboard();
    body.innerHTML = '';
    if (!rows.length) {
      body.innerHTML = '<tr><td colspan="5" style="color:var(--text-mid);">這個班級還沒有名單，或今天還沒有人作答。</td></tr>';
      return;
    }
    rows.forEach((r, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = '<td>' + (i + 1) + '</td><td>' + r.seatNo + ' 號</td><td>' + r.correctCount + '</td>' +
        '<td>' + r.answeredCount + ' / ' + r.totalSubQs + '</td><td>' + r.totalTime + ' 秒</td>';
      body.appendChild(tr);
    });
  } catch (e) {
    body.innerHTML = '<tr><td colspan="5" style="color:var(--danger);">計算失敗：' + e.message + '</td></tr>';
  }
}

function openLeaderboard() {
  document.getElementById('leaderboardCard').classList.remove('hidden');
  document.getElementById('leaderboardCard').scrollIntoView({ behavior: 'smooth' });
  renderLeaderboard();
}
document.getElementById('showLeaderboardBtn').addEventListener('click', openLeaderboard);
document.getElementById('showLeaderboardBtnEnded').addEventListener('click', openLeaderboard);
document.getElementById('recalcLeaderboardBtn').addEventListener('click', renderLeaderboard);
</script>
